name: Build Android APK

# Builds a shareable release APK on GitHub (no EAS) and publishes it to Releases.
# Share: https://github.com/tajbirhossain/microsubtracker/releases/tag/preview-latest

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "assets/**"
      - ".github/workflows/build-android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Gradle preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    env:
      CI: "1"
      EXPO_PUBLIC_API_URL: https://api.microsubtracker.tajbirhossain.com/api
      # Real phones only — skips x86 emulator ABIs (faster + much smaller APK)
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Google removed the old `tools` package; v3 default still asked for it.
          packages: platform-tools

      - name: Cache Gradle deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Tune Gradle for CI
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("android/gradle.properties")
          text = path.read_text()
          lines = [
              line
              for line in text.splitlines()
              if not line.startswith("org.gradle.jvmargs=")
              and not line.startswith("org.gradle.parallel=")
              and not line.startswith("org.gradle.caching=")
          ]
          lines.extend(
              [
                  "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8",
                  "org.gradle.parallel=true",
                  "org.gradle.caching=true",
                  "android.enableJetifier=true",
              ]
          )
          path.write_text("\n".join(lines) + "\n")
          print(path.read_text())
          PY

      - name: Build release APK
        working-directory: android
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease \
            --no-daemon \
            --build-cache \
            --stacktrace \
            -x lintVitalAnalyzeRelease \
            -x lintVitalRelease \
            -x testReleaseUnitTest \
            | tee ../gradle-build.log

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Stage APK
        run: |
          set -euo pipefail
          SRC="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$SRC" ]; then
            echo "APK not found under android/app/build/outputs/apk/release"
            find android/app/build/outputs -type f -name '*.apk' || true
            exit 1
          fi
          cp "$SRC" microsubtracker-preview.apk
          ls -lh microsubtracker-preview.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          SIZE="$(du -h microsubtracker-preview.apk | cut -f1)"
          NOTES="$(printf '%s\n\n%s\n%s\n%s\n' \
            "Preview APK for recruiters (no Expo account needed)." \
            "Commit: ${GITHUB_SHA}" \
            "Size: ${SIZE}" \
            "Install: uninstall any older Micro Sub Tracker build first, then download this APK → allow unknown apps → open the file.")"

          if gh release view preview-latest >/dev/null 2>&1; then
            gh release delete preview-latest --yes --cleanup-tag
          fi

          gh release create preview-latest \
            microsubtracker-preview.apk \
            --title "Preview APK (${SHORT_SHA})" \
            --notes "$NOTES" \
            --prerelease

          echo "Share this link:"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/preview-latest"
